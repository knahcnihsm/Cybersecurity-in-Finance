server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/auth/**
        - id: asset-service
          uri: ${ASSET_SERVICE_URL}
          predicates:
            - Path=/api/assets/**
        - id: vulnerability-service
          uri: ${VULNERABILITY_SERVICE_URL}
          predicates:
            - Path=/api/vulnerabilities/**
        - id: control-service
          uri: ${CONTROL_SERVICE_URL}
          predicates:
            - Path=/api/controls/**
        - id: ingestion-service
          uri: ${INGESTION_SERVICE_URL}
          predicates:
            - Path=/api/ingestion/**
        - id: risk-engine
          uri: ${RISK_ENGINE_URL}
          predicates:
            - Path=/api/risk/**
        - id: investment-optimizer
          uri: ${INVESTMENT_OPTIMIZER_URL}
          predicates:
            - Path=/api/investment/**
        - id: ai-service
          uri: ${AI_SERVICE_URL}
          predicates:
            - Path=/api/ai/**
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.cybergate.gateway: DEBUG

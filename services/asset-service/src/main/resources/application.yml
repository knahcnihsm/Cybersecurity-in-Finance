server:
  port: ${PORT:8082}

spring:
  application:
    name: asset-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cybergate}?sslmode=require}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: asset
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

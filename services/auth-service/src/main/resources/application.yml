server:
  port: 8081

spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiry: ${JWT_EXPIRY:3600}
  refresh-expiry: ${JWT_REFRESH_EXPIRY:604800}

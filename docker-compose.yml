version: "3.9"

services:
  # ─── Infrastructure ───────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Backend: Java Services ──────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ASSET_SERVICE_URL=http://asset-service:8082
      - VULN_SERVICE_URL=http://vulnerability-service:8083
      - CONTROL_SERVICE_URL=http://control-service:8084
      - INGESTION_SERVICE_URL=http://ingestion-service:8085
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - RISK_ENGINE_URL=http://risk-engine:8090
      - INVESTMENT_URL=http://investment-optimizer:8091
      - AI_SERVICE_URL=http://ai-service:8092
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth-service
      - redis
    networks:
      - cyberrisk-net

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-900000}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-604800000}
    depends_on:
      - redis
    networks:
      - cyberrisk-net

  asset-service:
    build:
      context: ./services/asset-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
    networks:
      - cyberrisk-net

  vulnerability-service:
    build:
      context: ./services/vulnerability-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
    networks:
      - cyberrisk-net

  control-service:
    build:
      context: ./services/control-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
    networks:
      - cyberrisk-net

  ingestion-service:
    build:
      context: ./services/ingestion-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - RISK_ENGINE_URL=http://risk-engine:8090
    depends_on:
      - redis
      - risk-engine
    networks:
      - cyberrisk-net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - cyberrisk-net

  # ─── Backend: Python Services ─────────────────────
  risk-engine:
    build:
      context: ./services/risk-engine
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - ASSET_SERVICE_URL=http://asset-service:8082
      - VULN_SERVICE_URL=http://vulnerability-service:8083
      - CONTROL_SERVICE_URL=http://control-service:8084
    depends_on:
      - redis
    networks:
      - cyberrisk-net

  investment-optimizer:
    build:
      context: ./services/investment-optimizer
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - RISK_ENGINE_URL=http://risk-engine:8090
      - CONTROL_SERVICE_URL=http://control-service:8084
    depends_on:
      - risk-engine
    networks:
      - cyberrisk-net

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "8092:8092"
    environment:
      - REDIS_URL=redis://redis:6379
      - RISK_ENGINE_URL=http://risk-engine:8090
      - ASSET_SERVICE_URL=http://asset-service:8082
      - INVESTMENT_URL=http://investment-optimizer:8091
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - USE_MOCK_LLM=${USE_MOCK_LLM:-true}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
    depends_on:
      - risk-engine
      - investment-optimizer
    networks:
      - cyberrisk-net

  # ─── Frontend ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_WS_URL=http://localhost:8086
    depends_on:
      - api-gateway
    networks:
      - cyberrisk-net

volumes:
  redis_data:

networks:
  cyberrisk-net:
    driver: bridge
